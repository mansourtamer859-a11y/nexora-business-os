name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages-deploy.yml"
      - "functions/**"
      - "migrations/**"
      - "public/**"
      - "src/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "wrangler.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, migrate D1, and deploy Pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source and build
        run: |
          npm run typecheck
          npm run lint
          npm run build

      - name: Validate production D1 binding
        run: |
          python3 - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          path = Path("wrangler.toml")
          parsed = tomllib.loads(path.read_text(encoding="utf-8"))
          databases = parsed.get("d1_databases", [])
          if len(databases) != 1 or databases[0].get("binding") != "DB":
              raise SystemExit("wrangler.toml must define exactly one production D1 binding named DB.")
          database_id = databases[0].get("database_id", "")
          if not re.fullmatch(r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}", database_id) or database_id == "00000000-0000-0000-0000-000000000000":
              raise SystemExit("wrangler.toml must contain the real production D1 UUID, not a placeholder.")
          PY

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Set CLOUDFLARE_API_TOKEN in repository secrets."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Set CLOUDFLARE_ACCOUNT_ID in repository secrets."; exit 1; }
          npx --yes wrangler@4 d1 migrations apply nexora-db --remote --config wrangler.toml

      - name: Deploy Pages assets and Functions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name nexus-business-erp-saas-os \
            --branch main \
            --config wrangler.toml
