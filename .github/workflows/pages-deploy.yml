name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages-deploy.yml"
      - "functions/**"
      - "migrations/**"
      - "public/**"
      - "src/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "wrangler.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, migrate D1, and deploy Pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source and build
        run: |
          npm run typecheck
          npm run lint
          npm run build

      - name: Prepare production Wrangler config
        env:
          CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
          CF_ACCESS_AUD: ${{ vars.CF_ACCESS_AUD }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          values = {
              "CF_ACCESS_TEAM_DOMAIN": os.environ.get("CF_ACCESS_TEAM_DOMAIN", ""),
              "CF_ACCESS_AUD": os.environ.get("CF_ACCESS_AUD", ""),
          }
          if not re.fullmatch(r"[A-Za-z0-9](?:[A-Za-z0-9.-]{0,251}[A-Za-z0-9])?", values["CF_ACCESS_TEAM_DOMAIN"]):
              raise SystemExit("Set the repository variable CF_ACCESS_TEAM_DOMAIN to the Cloudflare Access team hostname.")
          if values["CF_ACCESS_TEAM_DOMAIN"].startswith("replace-"):
              raise SystemExit("CF_ACCESS_TEAM_DOMAIN must not be a placeholder.")
          if not values["CF_ACCESS_AUD"] or values["CF_ACCESS_AUD"].startswith("replace-") or len(values["CF_ACCESS_AUD"]) > 512 or re.search(r"\s", values["CF_ACCESS_AUD"]):
              raise SystemExit("Set the repository variable CF_ACCESS_AUD to the Cloudflare Access application audience.")

          path = Path("wrangler.toml")
          config = path.read_text(encoding="utf-8")
          parsed = tomllib.loads(config)
          databases = parsed.get("d1_databases", [])
          if len(databases) != 1 or databases[0].get("binding") != "DB":
              raise SystemExit("wrangler.toml must define exactly one production D1 binding named DB.")
          database_id = databases[0].get("database_id", "")
          if not re.fullmatch(r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}", database_id) or database_id == "00000000-0000-0000-0000-000000000000":
              raise SystemExit("wrangler.toml must contain the real production D1 UUID, not a placeholder.")

          replacements = {
              'CF_ACCESS_TEAM_DOMAIN = "replace-with-your-team.cloudflareaccess.com"':
                  f"CF_ACCESS_TEAM_DOMAIN = {json.dumps(values['CF_ACCESS_TEAM_DOMAIN'])}",
              'CF_ACCESS_AUD = "replace-with-your-access-application-audience"':
                  f"CF_ACCESS_AUD = {json.dumps(values['CF_ACCESS_AUD'])}",
          }
          for original, replacement in replacements.items():
              if original not in config:
                  raise SystemExit(f"Expected Access placeholder missing from {path}: {original.split(' = ')[0]}")
              config = config.replace(original, replacement, 1)

          generated = tomllib.loads(config)
          if generated["d1_databases"][0]["database_id"] != database_id:
              raise SystemExit("Generated config changed the production D1 binding unexpectedly.")
          Path(".wrangler-deploy.toml").write_text(config, encoding="utf-8")
          PY

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Set CLOUDFLARE_API_TOKEN in repository secrets."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Set CLOUDFLARE_ACCOUNT_ID in repository secrets."; exit 1; }
          npx --yes wrangler@4 d1 migrations apply nexora-db --remote --config .wrangler-deploy.toml

      - name: Deploy Pages assets and Functions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name nexus-business-erp-saas-os \
            --branch main \
            --config .wrangler-deploy.toml
